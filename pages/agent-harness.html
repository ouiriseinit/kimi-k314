<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUIRISE · Task Harness</title>
  <!-- style guide: glass morphism, 3D depth, agent‑inspired UI -->
  <style>
    /* ═══════════════════════════════════════════════════════════════
       MULTI-AGENT HARNESS TASK DASHBOARD
       Full localStorage app — OUIRISE style
       ═══════════════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --z-bg: -100; --z-base: 0; --z-content: 10; --z-card: 20;
      --z-float: 30; --z-overlay: 40; --z-tooltip: 50; --z-nav: 60; --z-top: 100;
      --void: #0a0a0a; --metal: #e8e8e8; --earth: #c9a96e; --water: #4a90a4;
      --fire: #c75b39; --wood: #6b9e75; --purple: #8B5CF6;
      --glass-bg: rgba(255,255,255,0.03); --glass-bg-hover: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.08); --glass-border-hover: rgba(255,255,255,0.15);
      --glass-blur: 24px; --glass-blur-lg: 40px;
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.4); --glass-shadow-lg: 0 16px 64px rgba(0,0,0,0.5);
      --perspective: 1200px;
      --ease-smooth: cubic-bezier(0.25,0.46,0.45,0.94);
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
      --duration-fast: 0.2s; --duration-normal: 0.4s; --duration-slow: 0.8s;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--void); color: var(--metal);
      min-height: 100vh; overflow-x: hidden; line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      padding: 0 1.5rem 4rem;
    }

    /* ── GLASS CARD (reusable) ── */
    .glass-card {
      position: relative; background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem 2rem 2rem;
      z-index: var(--z-card); transition: all var(--duration-normal) var(--ease-smooth);
      transform-style: preserve-3d; perspective: var(--perspective); overflow: hidden;
    }
    .glass-card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px;
      background: linear-gradient(135deg,rgba(255,255,255,0.15) 0%,rgba(255,255,255,0.03) 50%,rgba(255,255,255,0.1) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; z-index: 1;
    }
    .glass-card::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(from 0deg,transparent 0%,rgba(201,169,110,0.03) 10%,rgba(74,144,164,0.03) 25%,transparent 35%,rgba(199,91,57,0.02) 50%,rgba(107,158,117,0.03) 65%,transparent 75%,rgba(201,169,110,0.02) 85%,transparent 100%);
      animation: holo-rotate 12s linear infinite; pointer-events: none; z-index: 0;
      opacity: 0; transition: opacity var(--duration-normal) var(--ease-smooth);
    }
    .glass-card:hover { background: var(--glass-bg-hover); border-color: var(--glass-border-hover); box-shadow: var(--glass-shadow-lg); transform: translateY(-4px) translateZ(20px); }
    .glass-card:hover::after { opacity: 1; }
    .glass-card > * { position: relative; z-index: 2; }

    /* ── TYPOGRAPHY ── */
    h1 { font-size: clamp(1.4rem,2.5vw,2rem); font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--earth); }
    h2 { font-size: clamp(2rem,4vw,3.2rem); font-weight: 200; letter-spacing: -0.02em; line-height: 1.2; color: var(--metal); }
    h3 { font-size: clamp(1.2rem,2vw,1.6rem); font-weight: 400; color: var(--metal); }
    h4 { font-size: clamp(1rem,1.5vw,1.2rem); font-weight: 500; color: var(--metal); }
    h5 { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--earth); }
    p { font-size: clamp(0.9rem,1.1vw,1rem); color: rgba(232,232,232,0.75); max-width: 65ch; }
    hr { border: none; height: 1px; background: linear-gradient(90deg,transparent,var(--glass-border),transparent); margin: 0; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-family: inherit; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.02em;
      padding: 0.6rem 1.4rem; border-radius: 12px; border: 1px solid transparent;
      cursor: pointer; transition: all var(--duration-fast) var(--ease-smooth);
      position: relative; overflow: hidden; transform-style: preserve-3d;
    }
    .btn-glass { background: var(--glass-bg); border-color: var(--glass-border); color: var(--metal); backdrop-filter: blur(12px); }
    .btn-glass:hover { background: var(--glass-bg-hover); border-color: var(--glass-border-hover); transform: translateY(-2px) translateZ(10px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .btn-primary { background: linear-gradient(135deg,var(--earth),rgba(201,169,110,0.8)); color: var(--void); border-color: transparent; }
    .btn-primary:hover { transform: translateY(-2px) translateZ(10px); box-shadow: 0 8px 32px rgba(201,169,110,0.3); }
    .btn-danger { background: rgba(199,91,57,0.2); border-color: rgba(199,91,57,0.3); color: var(--fire); }
    .btn-danger:hover { background: rgba(199,91,57,0.3); transform: translateY(-2px); }

    .kimi-iframe-wrapper {
      max-width: 1000px;
      margin: 0 auto 3rem;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow:
        0 20px 60px rgba(0,0,0,0.4),
        inset 0 1px 0 var(--glass-highlight);
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .kimi-iframe-wrapper iframe {
      width: 100%;
      height: 500px;
      border: none;
      display: block;
    }

    /* ── LAYOUT ── */
    .app-header { padding: 2rem 0 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .app-header h1 { margin: 0; }
    .stats { display: flex; gap: 1.5rem; font-size: 0.9rem; color: rgba(232,232,232,0.6); }
    .stats span { display: flex; align-items: center; gap: 0.3rem; }

    .task-grid { display: grid; gap: 1.2rem; margin-top: 2rem; }
    .task-item { display: flex; align-items: center; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .task-item:last-child { border-bottom: none; }
    .task-check { width: 20px; height: 20px; accent-color: var(--earth); cursor: pointer; flex-shrink: 0; }
    .task-text { flex: 1; font-size: 1rem; color: var(--metal); transition: opacity var(--duration-fast); }
    .task-text.done { text-decoration: line-through; opacity: 0.4; }
    .task-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .task-actions .btn { padding: 0.3rem 0.8rem; font-size: 0.75rem; }

    .input-row { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1.2rem; }
    .input-row input, .input-row select {
      flex: 1; min-width: 160px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 0.7rem 1rem;
      color: var(--metal); font-size: 0.95rem;
      transition: border var(--duration-fast);
    }
    .input-row input:focus, .input-row select:focus { outline: none; border-color: var(--earth); }
    .input-row input::placeholder { color: rgba(232,232,232,0.3); }

    .empty-state { text-align: center; padding: 3rem 1rem; color: rgba(232,232,232,0.3); }

    /* depth layers */
    .depth-layer { position: fixed; inset: 0; pointer-events: none; z-index: var(--z-bg); overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12; animation: orb-float 20s ease-in-out infinite; }
    .orb-1 { width: 400px; height: 400px; background: var(--earth); top: -10%; left: -5%; animation-delay: 0s; }
    .orb-2 { width: 350px; height: 350px; background: var(--water); bottom: -10%; right: -5%; animation-delay: -7s; }
    .orb-3 { width: 250px; height: 250px; background: var(--fire); top: 40%; left: 60%; animation-delay: -14s; opacity: 0.08; }

    @keyframes holo-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orb-float { 0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(30px,-20px) scale(1.05); } 50% { transform: translate(-20px,30px) scale(0.95); } 75% { transform: translate(20px,20px) scale(1.02); } }

    /* scroll */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--void); }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
    ::selection { background: rgba(201,169,110,0.3); color: var(--metal); }

    @media (max-width: 600px) {
      body { padding: 0 0.8rem 2rem; }
      .app-header { flex-direction: column; align-items: stretch; }
      .stats { justify-content: space-between; }
      .input-row { flex-direction: column; }
      .input-row input, .input-row select { min-width: auto; }
    }
  </style>
</head>
<body>

<!-- ambient depth -->
<div class="depth-layer"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<!-- app -->
<div style="max-width: 1000px; margin: 0 auto;">

  <!-- header -->
  <header class="app-header">
    <h1>◈ OUIRISE · Task Harness</h1>
    <div class="stats">
      <span>⚡ <span id="activeCount">0</span> active</span>
      <span>✓ <span id="doneCount">0</span> done</span>
    </div>
  </header>

  <!-- main glass panel -->
  <section class="glass-card" style="padding: 1.8rem 2rem 2rem; margin-bottom: 2rem;">
    <!-- add task row -->
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="New task … (e.g. ‘Refactor auth’)" />
      <select id="prioritySelect">
        <option value="medium">⚡ medium</option>
        <option value="high">🔥 high</option>
        <option value="low">🌱 low</option>
      </select>
      <button class="btn btn-primary" id="addBtn">+ Add Task</button>
      <button class="btn btn-glass" id="clearDoneBtn">Clear done</button>
    </div>

    <!-- task list -->
    <div id="taskList" class="task-grid" style="margin-top: 1.8rem;">
      <!-- rendered by JS -->
    </div>

    <!-- footer meta -->
    <div style="margin-top: 1.5rem; font-size: 0.7rem; color: rgba(232,232,232,0.2); display: flex; justify-content: space-between; flex-wrap: wrap;">
      <span>persisted in localStorage · agent‑style harness</span>
      <span id="taskCount">0 tasks</span>
    </div>
  </section>

    <div class="kimi-iframe-wrapper">
      <iframe 
        src="https://kimi.moonshot.cn" 
        title="Kimi AI Assistant"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
        allow="clipboard-write"
      ></iframe>
    </div>
</div>

<script>
  (function() {
    "use strict";

    // ----- storage key -----
    const STORAGE_KEY = 'ouirise_tasks_harness';

    // ----- state -----
    let tasks = [];

    // ----- DOM refs -----
    const taskListEl = document.getElementById('taskList');
    const taskInput = document.getElementById('taskInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const addBtn = document.getElementById('addBtn');
    const clearDoneBtn = document.getElementById('clearDoneBtn');
    const activeCountEl = document.getElementById('activeCount');
    const doneCountEl = document.getElementById('doneCount');
    const taskCountEl = document.getElementById('taskCount');

    // ----- helpers -----
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    // ----- load from localStorage -----
    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            tasks = parsed;
            return;
          }
        }
      } catch (_) { /* ignore */ }
      // fallback seed
      tasks = [
        { id: generateId(), text: 'Design harness architecture', done: false, priority: 'high' },
        { id: generateId(), text: 'Implement agent loop', done: false, priority: 'medium' },
        { id: generateId(), text: 'Review OpenCode harness', done: true, priority: 'low' },
      ];
    }

    // ----- save to localStorage -----
    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (_) { /* ignore */ }
    }

    // ----- render task list -----
    function render() {
      if (!taskListEl) return;

      // update counters
      const active = tasks.filter(t => !t.done).length;
      const done = tasks.filter(t => t.done).length;
      if (activeCountEl) activeCountEl.textContent = active;
      if (doneCountEl) doneCountEl.textContent = done;
      if (taskCountEl) taskCountEl.textContent = tasks.length + ' tasks';

      if (tasks.length === 0) {
        taskListEl.innerHTML = `<div class="empty-state">⏻ no tasks · add one above</div>`;
        return;
      }

      // sort: active first, then priority (high > medium > low)
      const priorityRank = { high: 0, medium: 1, low: 2 };
      const sorted = [...tasks].sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return (priorityRank[a.priority] ?? 1) - (priorityRank[b.priority] ?? 1);
      });

      let html = '';
      for (const task of sorted) {
        const doneClass = task.done ? 'done' : '';
        const priorityLabel = task.priority || 'medium';
        const emoji = priorityLabel === 'high' ? '🔥' : priorityLabel === 'low' ? '🌱' : '⚡';

        html += `
          <div class="task-item" data-id="${task.id}">
            <input type="checkbox" class="task-check" ${task.done ? 'checked' : ''} />
            <span class="task-text ${doneClass}">${emoji} ${escapeHtml(task.text)}</span>
            <div class="task-actions">
              <button class="btn btn-glass delete-btn" style="padding:0.2rem 0.7rem; font-size:0.7rem;">✕</button>
            </div>
          </div>
        `;
      }
      taskListEl.innerHTML = html;

      // ----- attach event listeners (delegation) -----
      // checkbox toggle
      taskListEl.querySelectorAll('.task-check').forEach((checkbox, index) => {
        checkbox.addEventListener('change', function(e) {
          e.stopPropagation();
          const item = this.closest('.task-item');
          if (!item) return;
          const id = item.dataset.id;
          const task = tasks.find(t => t.id === id);
          if (task) {
            task.done = this.checked;
            saveTasks();
            render();
          }
        });
      });

      // delete button
      taskListEl.querySelectorAll('.delete-btn').forEach((btn) => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const item = this.closest('.task-item');
          if (!item) return;
          const id = item.dataset.id;
          tasks = tasks.filter(t => t.id !== id);
          saveTasks();
          render();
        });
      });
    }

    // simple escape to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ----- add new task -----
    function addTask() {
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }
      const priority = prioritySelect.value || 'medium';
      const newTask = {
        id: generateId(),
        text: text,
        done: false,
        priority: priority,
      };
      tasks.push(newTask);
      saveTasks();
      render();
      taskInput.value = '';
      taskInput.focus();
    }

    // ----- clear done tasks -----
    function clearDone() {
      const hasDone = tasks.some(t => t.done);
      if (!hasDone) return;
      tasks = tasks.filter(t => !t.done);
      saveTasks();
      render();
    }

    // ----- init -----
    function init() {
      loadTasks();
      render();

      // event listeners
      addBtn.addEventListener('click', addTask);
      taskInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addTask();
        }
      });
      clearDoneBtn.addEventListener('click', clearDone);
    }

    // boot
    document.addEventListener('DOMContentLoaded', init);
  })();
</script>

</body>
</html>
